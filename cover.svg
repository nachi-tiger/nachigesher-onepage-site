<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ff4fd8" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#a78bfa" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#ffd36a" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="#0b0b10"/>
